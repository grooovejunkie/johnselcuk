name: build

# Her push'ta test; "v1.0.0" gibi bir etiket atılınca Windows/macOS/Linux kurulum
# dosyaları üretilir ve GitHub Releases'e taslak sürüm olarak yüklenir.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # ffmpeg-static, kurulum sırasında o işletim sistemine uygun ffmpeg'i indirir;
      # bu yüzden her platform kendi makinesinde paketlenir.
      - run: npm ci
      # Eklenti zip'i paketlemeden önce: Linux paketi başarısız olsa bile eklenti yayımlanır.
      - name: Eklentiyi zip'le
        if: matrix.os == 'ubuntu-latest'
        run: mkdir -p dist && cd extension && zip -r ../dist/SDM-chrome-eklentisi.zip .
      - name: Paketle
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SDM-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
          if-no-files-found: ignore
      - name: Sürüm numarasını oku
        if: always()
        id: ver
        shell: bash
        run: echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Etiketle tetiklenince o etiket, elle (Run workflow) tetiklenince package.json'daki
      # sürüm kullanılır; etiket yoksa bu adım onu oluşturur.
      - name: Sürüme yükle
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: SDM ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.v }}
          draft: false
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
